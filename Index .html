<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prakash CCE Result</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    background:#f3f6fa;
    color:#222;
}

header{
    background:#174a7e;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:6px 0 0;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

button,
select,
input{
    font-size:15px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    cursor:pointer;
    background:#174a7e;
    color:white;
}

button:hover{
    opacity:.9;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:7px;
    background:white;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.menu button{
    background:#286da8;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,
td{
    border:1px solid #ccc;
    padding:7px;
    text-align:center;
}

th{
    background:#e8f0f7;
}

.student-name{
    min-width:200px;
    text-align:left;
}

.small-input{
    width:70px;
}

.total{
    font-weight:bold;
}

.converted{
    font-weight:bold;
}

.grade{
    font-weight:bold;
}

.info{
    background:#eef7ff;
    padding:12px;
    border-radius:8px;
    margin:10px 0;
}

.warning{
    color:#b42318;
    font-weight:bold;
}

.success{
    color:#137333;
    font-weight:bold;
}

@media(max-width:600px){

    header h1{
        font-size:21px;
    }

    button{
        width:100%;
    }

    .menu button{
        width:100%;
    }
}

@media print{

    header,
    .menu,
    button,
    .no-print{
        display:none !important;
    }

    body{
        background:white;
    }

    .card{
        box-shadow:none;
    }
}
</style>
</head>

<body>

<header>

<h1>📘 Prakash CCE Result</h1>

<p>CCE / FA / SA Marks Management</p>

</header>

<div class="container">

<div class="menu">

<button onclick="showSection('school')">
🏫 School Information
</button>

<button onclick="showSection('students')">
👨‍🎓 Students
</button>

<button onclick="showSection('marks')">
📝 FA / SA Marks
</button>

<button onclick="showSection('report')">
📋 Consolidated Report
</button>

</div>


<!-- SCHOOL -->

<div id="school" class="section active">

<div class="card">

<h2>🏫 School Information</h2>

<div class="grid">

<div>
<label>ಶಾಲೆಯ ಹೆಸರು</label>
<input id="schoolName">
</div>

<div>
<label>DISE / UDISE ಸಂಖ್ಯೆ</label>
<input id="udise">
</div>

<div>
<label>ಶೈಕ್ಷಣಿಕ ವರ್ಷ</label>
<input id="year" value="2026-27">
</div>

<div>
<label>ತಾಲ್ಲೂಕು</label>
<input id="taluk">
</div>

<div>
<label>ಜಿಲ್ಲೆ</label>
<input id="district">
</div>

</div>

<br>

<button onclick="saveSchool()">
💾 Save School Information
</button>

</div>

</div>


<!-- STUDENTS -->

<div id="students" class="section">

<div class="card">

<h2>👨‍🎓 Student Management</h2>

<div class="grid">

<div>

<label>ತರಗತಿ</label>

<select id="studentClass"
onchange="renderStudents()">

<option value="1">1ನೇ ತರಗತಿ</option>
<option value="2">2ನೇ ತರಗತಿ</option>
<option value="3">3ನೇ ತರಗತಿ</option>
<option value="4">4ನೇ ತರಗತಿ</option>
<option value="5">5ನೇ ತರಗತಿ</option>
<option value="6">6ನೇ ತರಗತಿ</option>
<option value="7">7ನೇ ತರಗತಿ</option>
<option value="8">8ನೇ ತರಗತಿ</option>

</select>

</div>

</div>

<br>

<button onclick="addStudent()">
➕ Add Student
</button>

<button onclick="document.getElementById('excelFile').click()">
📥 Excel Import
</button>

<input
type="file"
id="excelFile"
accept=".xlsx,.xls,.csv"
style="display:none"
onchange="importExcel(event)"
>

📤 Excel Export
</button>

Excel format:
<b>Sl No | Student Name</b>
</p>

<!-- MARKS -->

<div id="marks" class="section">

<div class="card">

<h2>📝 FA / SA Marks</h2>

<div class="grid">

<div>

<label>ತರಗತಿ</label>

<select id="marksClass"
onchange="renderMarks()">

<option value="1">1ನೇ ತರಗತಿ</option>
<option value="2">2ನೇ ತರಗತಿ</option>
<option value="3">3ನೇ ತರಗತಿ</option>
<option value="4">4ನೇ ತರಗತಿ</option>
<option value="5">5ನೇ ತರಗತಿ</option>
<option value="6">6ನೇ ತರಗತಿ</option>
<option value="7">7ನೇ ತರಗತಿ</option>
<option value="8">8ನೇ ತರಗತಿ</option>

</select>

</div>

<div>

<label>Assessment</label>

<select id="assessment"
onchange="renderMarks()">

<option value="FA1">FA 1</option>
<option value="FA2">FA 2</option>
<option value="FA3">FA 3</option>

<option value="SA2">SA 2</option>

</select>

</div>

</div>

</div>

<!-- REPORT -->

<div id="report" class="section">

<div class="card">

<h2>📋 ಕ್ರೂಡೀಕೃತ ನಮೂನೆ</h2>

<div class="grid">

<div>

<label>ತರಗತಿ</label>

<select id="reportClass"
onchange="renderReport()">

<option value="1">1ನೇ ತರಗತಿ</option>
<option value="2">2ನೇ ತರಗತಿ</option>
<option value="3">3ನೇ ತರಗತಿ</option>
<option value="4">4ನೇ ತರಗತಿ</option>
<option value="5">5ನೇ ತರಗತಿ</option>
<option value="6">6ನೇ ತರಗತಿ</option>
<option value="7">7ನೇ ತರಗತಿ</option>
<option value="8">8ನೇ ತರಗತಿ</option>

</select>

</div>

</div>

<br>

<button onclick="window.print()">
🖨 Print
</button>

<button onclick="exportReportExcel()">
📤 Excel
</button>

<div id="reportTable"></div>

</div>

</div>

<script>

const STORAGE_KEY = "prakash_cce_result";

let data = {

school:{
name:"",
udise:"",
year:"2026-27",
taluk:"",
district:""
},

students:{},

marks:{}

};


function loadData(){

const saved =
localStorage.getItem(STORAGE_KEY);

if(saved){

try{

data = JSON.parse(saved);

}catch(e){}

}

}


function saveData(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);

}


function showSection(id){

document
.querySelectorAll(".section")
.forEach(s =>
s.classList.remove("active")
);

document
.getElementById(id)
.classList.add("active");

if(id==="school") loadSchool();

if(id==="students") renderStudents();

if(id==="marks") renderMarks();

if(id==="report") renderReport();

}


function loadSchool(){

document.getElementById("schoolName").value =
data.school.name || "";

document.getElementById("udise").value =
data.school.udise || "";

document.getElementById("year").value =
data.school.year || "2026-27";

document.getElementById("taluk").value =
data.school.taluk || "";

document.getElementById("district").value =
data.school.district || "";

}


function saveSchool(){

data.school.name =
document.getElementById("schoolName").value.trim();

data.school.udise =
document.getElementById("udise").value.trim();

data.school.year =
document.getElementById("year").value.trim();

data.school.taluk =
document.getElementById("taluk").value.trim();

data.school.district =
document.getElementById("district").value.trim();

saveData();

alert("ಶಾಲೆಯ ಮಾಹಿತಿ Save ಆಗಿದೆ.");

}


function uid(){

return Date.now().toString(36) +
Math.random().toString(36).substring(2);

}


function getStudents(c){

if(!data.students[c])
data.students[c]=[];

return data.students[c];

}


function addStudent(){

const c =
document.getElementById("studentClass").value;

getStudents(c).push({

id:uid(),

name:""

});

saveData();

renderStudents();

}


function renderStudents(){

const c =
document.getElementById("studentClass").value;

const list =
getStudents(c);

let html = `

<div class="table-box">

<table>

<tr>

<th>Sl No</th>

<th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>

<th>Delete</th>

</tr>

`;

list.forEach((s,i)=>{

html += `

<tr>

<td>${i+1}</td>

<td>

<input
class="student-name"
value="${escapeHtml(s.name)}"
onchange="updateStudent('${s.id}',this.value)"
>

</td>

<td>

<button
onclick="deleteStudent('${s.id}')"
>
Delete
</button>

</td>

</tr>

`;

});

html += `

</table>

</div>

`;

document.getElementById("studentTable").innerHTML =
html;

}


function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function updateStudent(id,name){

const c =
document.getElementById("studentClass").value;

const s =
getStudents(c).find(x=>x.id===id);

if(s){

s.name=name.trim();

saveData();

renderReport();

}

}


function deleteStudent(id){

if(!confirm("ವಿದ್ಯಾರ್ಥಿಯನ್ನು ಅಳಿಸಬೇಕೆ?"))
return;

const c =
document.getElementById("studentClass").value;

data.students[c] =
getStudents(c).filter(s=>s.id!==id);

saveData();

renderStudents();

}


function importExcel(event){

const file =
event.target.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload=function(e){

const workbook =
XLSX.read(e.target.result,{type:"array"});

const sheet =
workbook.Sheets[
workbook.SheetNames[0]
];

const rows =
XLSX.utils.sheet_to_json(
sheet,
{header:1}
);

const c =
document.getElementById("studentClass").value;

const list =
getStudents(c);

const existing =
new Set(
list.map(s =>
s.name.trim().toLowerCase()
)
);

rows.forEach((row,index)=>{

if(index===0 &&
String(row[1]||"")
.toLowerCase()
.includes("name"))
return;

const name =
String(row[1] || row[0] || "")
.trim();

if(!name ||
!isNaN(name))
return;

if(!existing.has(name.toLowerCase())){

list.push({

id:uid(),

name:name

});

existing.add(
name.toLowerCase()
);

}

});

saveData();

renderStudents();

alert("Excel Import ಪೂರ್ಣಗೊಂಡಿದೆ.");

};

reader.readAsArrayBuffer(file);

event.target.value="";

}


function exportStudents(){

const c =
document.getElementById("studentClass").value;

const rows=[
["Sl No","Student Name"]
];

getStudents(c).forEach((s,i)=>{

rows.push([
i+1,
s.name
]);

});

const ws =
XLSX.utils.aoa_to_sheet(rows);

const wb =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
"Students"
);

XLSX.writeFile(
wb,
`Class_${c}_Students.xlsx`
);

}


const FA_COMPONENTS=[

["homework","ಗೃಹಪಾಠ"],
["unitTest","ಘಟಕ ಪರೀಕ್ಷೆ"],
["thinking","ಯೋಚನಾ ಕಾರ್ಯ"],
["activity","ಚಟುವಟಿಕೆ ಪುಸ್ತಕ"],
["participation","ತರಗತಿ ಭಾಗವಹಿಸುವಿಕೆ"]

];


function getMarkRecord(c,a,id){

if(!data.marks[c])
data.marks[c]={};

if(!data.marks[c][a])
data.marks[c][a]={};

if(!data.marks[c][a][id])
data.marks[c][a][id]={};

return data.marks[c][a][id];

}


function isFA(a){

return a.startsWith("FA");

}


function getFAScale(c){

return Number(c)<=5 ? 15 : 10;

}


function calculateFA(c,r){

let values =
FA_COMPONENTS.map(x=>r[x[0]]);

if(values.some(v=>v==="" || v===undefined))
return {
total:null,
converted:null,
grade:""
};

let nums =
values.map(Number);

if(nums.some(v=>!Number.isFinite(v)))
return {
total:null,
converted:null,
grade:""
};

const total =
nums.reduce((a,b)=>a+b,0);

if(total>50)
return {
total,
converted:null,
grade:""
};

const scale =
getFAScale(c);

const raw =
(total/50)*scale;

/*
  IMPORTANT:
  0.5 rule
  9.3 -> 9
  9.5 -> 10
  9.6 -> 10
*/

const converted =
Math.round(raw);

const grade =
getGrade(converted,scale);

return {
total,
converted,
grade
};

}


/*
CCE Grade function

Grade bands can be changed here
according to the official school rule.
*/

function getGrade(mark,max){

const percentage =
(mark/max)*100;

if(percentage>=90)
return "A+";

if(percentage>=80)
return "A";

if(percentage>=70)
return "B+";

if(percentage>=60)
return "B";

if(percentage>=50)
return "C+";

if(percentage>=40)
return "C";

return "D";

}


function calculateSA(c,a,r){

if(r.obtained==="" ||
r.obtained===undefined)
return {
converted:null,
grade:""
};

const obtained =
Number(r.obtained);

if(!Number.isFinite(obtained) ||
obtained<0)
return {
converted:null,
grade:""
};

/*
Reference scale:
SA = 30
No 20-mark conversion.
*/

const raw =
(obtained/100)*30;

const converted =
Math.round(raw);

return {

converted,

grade:getGrade(converted,30)

};

}


function renderMarks(){

const c =
document.getElementById("marksClass").value;

const a =
document.getElementById("assessment").value;

const list =
getStudents(c);

const scale =
isFA(a)
?getFAScale(c)
:30;

document.getElementById(
"conversionInfo"
).innerHTML =

isFA(a)

?

`<b>${a}</b>:
50 → ${scale} ಅಂಕಗಳಿಗೆ Conversion.
Decimal rounding:
9.3 → 9, 9.5 → 10, 9.6 → 10.
20ಕ್ಕೆ conversion ಇಲ್ಲ.`

:

`<b>${a}</b>:
SA → 30 ಅಂಕಗಳಿಗೆ Conversion.
20ಕ್ಕೆ conversion ಇಲ್ಲ.`;

let html=`

<div class="table-box">

<table>

<tr>

<th>Sl No</th>

<th>ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು</th>
`;

if(isFA(a)){

FA_COMPONENTS.forEach(x=>{

html+=`<th>${x[1]}</th>`;

});

html+=`

<th>50ಕ್ಕೆ Total</th>

<th>Converted</th>

<th>Grade</th>

`;

}else{

html+=`

<th>SA Marks</th>
<th>Converted</th>
<th>Grade</th>

`;

}

html+=`</tr>`;

list.forEach((s,i)=>{

const r =
getMarkRecord(c,a,s.id);

if(isFA(a)){

const q =
calculateFA(c,r);

html+=`

<tr>

<td>${i+1}</td>

<td class="student-name">
${escapeHtml(s.name)}
</td>

`;

FA_COMPONENTS.forEach(x=>{

html+=`

<td>

<input
class="small-input"
type="number"
min="0"
max="10"
value="${r[x[0]] ?? ""}"
onchange="
updateFA(
'${c}',
'${a}',
'${s.id}',
'${x[0]}',
this.value
)
"
>

</td>

`;

});

html+=`

<td class="total">
${q.total===null?"-":q.total}

${q.total>50
?'<div class="warning">50 ಮೀರಿದೆ</div>'
:""}

</td>

<td class="converted">
${q.converted===null?"-":q.converted}
</td>

<td class="grade">
${q.grade||"-"}
</td>

</tr>

`;

}else{

const q =
calculateSA(c,a,r);

html+=`

<tr>

<td>${i+1}</td>

<td class="student-name">
${escapeHtml(s.name)}
</td>

<td>

<input
class="small-input"
type="number"
min="0"
value="${r.obtained ?? ""}"
onchange="
updateSA(
'${c}',
'${a}',
'${s.id}',
this.value
)
"
>

</td>

<td class="converted">
${q.converted===null?"-":q.converted}
</td>

<td class="grade">
${q.grade||"-"}
</td>

</tr>

`;

}

});

html+=`

</table>

</div>

`;

document.getElementById("marksTable").innerHTML=html;

}


function updateFA(c,a,id,field,value){

if(value===""){

delete getMarkRecord(c,a,id)[field];

saveData();

renderMarks();

return;

}

const n=Number(value);

if(!Number.isFinite(n) ||
n<0 ||
n>10){

alert("0 ರಿಂದ 10ರ ಒಳಗಿನ ಅಂಕ ನಮೂದಿಸಿ.");

renderMarks();

return;

}

getMarkRecord(c,a,id)[field]=n;

saveData();

renderMarks();

renderReport();

}


function updateSA(c,a,id,value){

if(value===""){

delete getMarkRecord(c,a,id).obtained;

saveData();

renderMarks();

return;

}

const n=Number(value);

if(!Number.isFinite(n)||n<0){

alert("ಸರಿಯಾದ ಅಂಕ ನಮೂದಿಸಿ.");

renderMarks();

return;

}

getMarkRecord(c,a,id).obtained=n;

saveData();

renderMarks();

renderReport();

}


function renderReport(){

const c =
document.getElementById("reportClass").value;

const list =
getStudents(c);

let html=`

<div class="info">

<h3>
${escapeHtml(data.school.name||"ಶಾಲೆಯ ಹೆಸರು")}
</h3>

<div>
DISE / UDISE:
${escapeHtml(data.school.udise||"-")}
</div>

<div>
ಶೈಕ್ಷಣಿಕ ವರ್ಷ:
${escapeHtml(data.school.year||"-")}
</div>

<div>
ತರಗತಿ:
${c}
</div>

</div>

<div class="table-box">

<table>

<tr>

<th>Sl No</th>

<th>ವಿದ್ಯಾರ್ಥಿಗಳ ಹೆಸರು</th>

<th>FA1</th>

<th>FA2</th>

<th>SA1</th>

<th>FA3</th>

<th>FA4</th>

<th>SA2</th>

</tr>

`;

list.forEach((s,i)=>{

html+=`

<tr>

<td>${i+1}</td>

<td class="student-name">
${escapeHtml(s.name)}
</td>

`;

["FA1","FA2","SA1","FA3","FA4","SA2"]
.forEach(a=>{

const r =
getMarkRecord(c,a,s.id);

let q;

if(isFA(a))
q=calculateFA(c,r);
else
q=calculateSA(c,a,r);

html+=`

<td>

${
q.converted===null
?"-"
:`${q.converted} - ${q.grade}`
}

</td>

`;

});

html+=`</tr>`;

});

html+=`

</table>

</div>

`;

document.getElementById("reportTable").innerHTML=html;

}


function exportReportExcel(){

const c =
document.getElementById("reportClass").value;

const rows=[

[
"School Name",
data.school.name
],

[
"DISE / UDISE",
data.school.udise
],

[
"Academic Year",
data.school.year
],

[
"Class",
c
],

[],

[
"Sl No",
"Student Name",
"FA1",
"FA2",
"SA1",
"FA3",
"FA4",
"SA2"
]

];

getStudents(c).forEach((s,i)=>{

const values=[
i+1,
s.name
];

["FA1","FA2","SA1","FA3","FA4","SA2"]
.forEach(a=>{

getMarkRecord(c,a,s.id);

isFA(a)
?calculateFA(c,r)
:calculateSA(c,a,r);

);
