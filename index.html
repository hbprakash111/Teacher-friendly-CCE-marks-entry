<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Teacher-Friendly CCE Marks Entry</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:"Noto Sans Kannada","Nirmala UI",Arial,sans-serif;
 background:#f1f5f9;
 color:#172033;
}
button,input,select{font:inherit}
.header{
 background:linear-gradient(135deg,#075985,#2563eb);
 color:#fff;
 padding:18px 12px;
 text-align:center;
}
.header h1{margin:0;font-size:25px}
.header p{margin:5px 0 0;font-size:14px}
.container{max-width:1400px;margin:auto;padding:12px}
.card{
 background:#fff;
 border-radius:14px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 2px 10px #00000012;
}
.title{
 color:#075985;
 font-size:20px;
 font-weight:800;
 margin-bottom:13px;
}
.dashboard{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
 gap:10px;
}
.feature{
 border:0;
 border-radius:12px;
 min-height:76px;
 padding:9px;
 cursor:pointer;
 background:#e0f2fe;
 color:#0f172a;
 font-weight:700;
 box-shadow:0 2px 5px #0002;
 transition:.15s;
}
.feature:hover{transform:translateY(-2px)}
.feature.active{background:#2563eb;color:#fff}
.feature .ico{display:block;font-size:25px;margin-bottom:5px}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:12px;
}
label{display:block;font-weight:700;margin-bottom:5px}
input,select{
 width:100%;
 min-height:43px;
 padding:8px 10px;
 border:1px solid #cbd5e1;
 border-radius:8px;
 background:#fff;
}
.btn{
 border:0;
 border-radius:8px;
 padding:10px 15px;
 color:#fff;
 background:#2563eb;
 cursor:pointer;
 font-weight:700;
}
.btn:hover{filter:brightness(.95)}
.green{background:#15803d}
.orange{background:#ea580c}
.red{background:#dc2626}
.gray{background:#475569}
.teal{background:#0f766e}
.action{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px;
}
.hidden{display:none!important}
.table-wrap{
 width:100%;
 overflow-x:auto;
 border:1px solid #dbe3ed;
 border-radius:9px;
}
table{
 border-collapse:collapse;
 width:100%;
 min-width:850px;
}
th,td{
 border:1px solid #dbe3ed;
 padding:7px;
 text-align:center;
 vertical-align:middle;
}
th{
 background:#e0f2fe;
 color:#0c4a6e;
}
td input{min-width:65px}
.name{text-align:left;min-width:190px}
.small{font-size:13px;color:#64748b}
.message{
 display:none;
 padding:11px;
 border-radius:8px;
 margin-bottom:12px;
 font-weight:700;
}
.message.show{display:block}
.success{background:#dcfce7;color:#166534}
.error{background:#fee2e2;color:#991b1b}
.info{background:#dbeafe;color:#1e40af}
.statgrid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
 margin-top:12px;
}
.stat{
 background:#f8fafc;
 border-radius:10px;
 padding:12px;
 text-align:center;
}
.stat strong{
 display:block;
 font-size:24px;
 color:#2563eb;
 margin-top:3px;
}
.badge{
 display:inline-block;
 padding:3px 8px;
 border-radius:20px;
 background:#e2e8f0;
 font-weight:700;
}
.grade{font-weight:800}
.modal{
 position:fixed;
 inset:0;
 background:#0008;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:1000;
}
.modal.show{display:flex}
.modalbox{
 background:#fff;
 width:min(650px,100%);
 max-height:90vh;
 overflow:auto;
 border-radius:14px;
 padding:18px;
}
.close{
 float:right;
 border:0;
 background:#fee2e2;
 color:#991b1b;
 padding:7px 10px;
 border-radius:7px;
 cursor:pointer;
}
.footer{text-align:center;color:#64748b;padding:20px}
@media(max-width:600px){
 .header h1{font-size:20px}
 .container{padding:7px}
 .card{padding:11px}
 .dashboard{grid-template-columns:repeat(2,1fr)}
 .feature{min-height:68px;font-size:12px}
 .feature .ico{font-size:21px}
}
@media print{
 body{background:#fff}
 .header,.dashboard,.no-print,#messageArea,.modal,.footer{display:none!important}
 .card{box-shadow:none;border:0;margin
